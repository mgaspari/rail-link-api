name: refresh

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Dependency-audit gate (no Russian-origin code)
        run: |
          if grep -iE 'Russia|Russian Federation|Yandex|Kaspersky|\bVK\b|Mail\.ru|Sberbank|Rostelecom' DEPENDENCIES.md; then
            echo "::error::DEPENDENCIES.md contains a disallowed (Russian-origin) entry"
            exit 1
          fi

      - name: Run unit tests
        run: pytest -q

      - name: Fetch source PDFs
        id: fetch
        run: |
          python -m scripts.fetch '[
            {"url": "https://www.mta.info/document/118701", "service_day": "weekday"}
          ]'

      - name: Parse PDFs to intermediate JSON
        run: |
          mkdir -p build
          python - <<'PY'
          import json, pathlib
          from scripts.parse import parse_pdf
          jobs = [("weekday", "data/sources/weekday.pdf")]
          out = {}
          for service, path in jobs:
              if pathlib.Path(path).exists():
                  out[service] = parse_pdf(pathlib.Path(path), service)
          pathlib.Path("build/parsed.json").write_text(json.dumps(out, indent=2))
          PY

      - name: Generate API JSON
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          from scripts.generate import generate
          parsed = json.loads(pathlib.Path("build/parsed.json").read_text())
          sources = []
          for service in parsed:
              pdf = pathlib.Path(f"data/sources/{service}.pdf")
              sources.append({
                  "url": "https://www.mta.info/document/118701" if service == "weekday" else "",
                  "hash": hashlib.sha256(pdf.read_bytes()).hexdigest(),
                  "service": service,
              })
          generate(parsed, sources)
          PY

      - name: Validate generated JSON
        id: validate
        run: python -m scripts.validate

      - name: Commit and push
        if: success()
        run: |
          git config user.name "rail-link-bot"
          git config user.email "rail-link-bot@users.noreply.github.com"
          git add docs/api data/sources
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore(refresh): update schedule data"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `refresh workflow failed (${context.runId})`;
            const body = [
              `The weekly refresh workflow failed.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Trigger: ${context.eventName}`,
              `- Commit: ${context.sha}`,
              ``,
              `No commit was made. Check the logs for the failing step.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["refresh-failure"],
            });
